# apparmor.d - aa-sync configuration.  Install to /etc/apparmor/aa-sync.conf
# Must be root-owned and not group/other-writable (it controls confinement).

[selection]
# no | used | group | all .  "used" = only profiles whose binary exists here.
mode = used
groups =
# include: force profiles on, regardless of stability and installed binaries.
# include_used: like include, but only where the profile's binary is installed
# -- the way to opt into e.g. testing profiles by glob without loading dead
# ones.  exclude always wins.  All three take shell-style globs.
include =
include_used =
exclude =

[stability]
# Which maturity sets are deployed.  Default: only the vetted "stable" set.
stable = enabled
testing = disabled
disabled = disabled

[mode]
# Production default is enforce.  complain is a per-profile debugging override:
#   complain = firefox thunderbird
default = enforce
complain =

[runtime]
reload = true
